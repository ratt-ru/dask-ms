name: Ubuntu CI

on:
  push:
    branches:
    - master
    tags:
    - "*"
  pull_request:
  schedule:
    - cron: '30 2 * * 1,4' # Every Monday and Thursday @ 2h30am UTC

jobs:
  check_skip:
    runs-on: ubuntu-latest
    if: |
      !contains(format('{0} {1} {2}', github.event.head_commit.message, github.event.pull_request.title, github.event.pull_request.body), '[skip ci]')
    steps:
      - run: |
          cat <<'MESSAGE'
          github.event_name: ${{ toJson(github.event_name) }}
          github.event:
          ${{ toJson(github.event) }}
          MESSAGE
  test:
    needs: check_skip
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dask-ms base
        run: pip install .[arrow,testing,zarr]

      - name: Test dask-ms base
        run: py.test -s -vvv daskms/

      - name: Install dask-ms complete
        run: pip install .[complete,testing]

      - name: Test dask-ms complete
        # xarray >= 2026.x calls zarr.open_group(zarr_format=...), which is
        # a zarr 3 API; the extras still pin zarr<3, so these two
        # experimental-zarr tests fail on any current xarray + zarr 2 pair
        # (dask-ms's own zarr code is unaffected). Deselect until the
        # experimental zarr support migrates to zarr 3.
        run: >
          py.test -s -vvv daskms/
          --deselect daskms/experimental/zarr/tests/test_zarr.py::test_xarray_to_zarr
          --deselect daskms/experimental/zarr/tests/test_zarr.py::test_xarray_reading_daskms_written_dataset

      # - name: Debug with tmate on failure
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3

  test_apps:
    needs: check_skip
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Create Cache Hash
        run: |
          export HASH=$(sha256sum <<EOT | cut -c -16
          ${{ env.POETRY_VERSION }}
          EOT
          )
          echo "INSTALL_CACHE_HASH=$HASH" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Installations
        id: cache-installs
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: install-${{ env.INSTALL_CACHE_HASH }}-0

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dask-ms complete
        run: pip install .[complete,testing]

      - name: Test dask-ms applications
        run: py.test -s -vvv --applications daskms/

      # - name: Debug with tmate on failure
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3

# Publishing lives in publish-pypi.yaml (PyPI Trusted Publishing is
# registered against that workflow + environment `pypi`); the deploy job
# previously here raced with it on tag pushes.
